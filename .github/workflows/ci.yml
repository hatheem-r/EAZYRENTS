name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ---- Job 1: lint the frontend source ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint

  # ---- Job 2: build every image and smoke-test the running stack ----
  # This is the strong part: CI doesn't just build the containers, it boots the
  # whole system (Postgres + migrations + API + frontend) and proves the API is
  # actually alive and connected to the database before anything is merged.
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/healthz; then
              echo "API is healthy and connected to the database"
              exit 0
            fi
            echo "waiting for API to come up... attempt $i"
            sleep 3
          done
          echo "API never became healthy. Container logs:"
          docker compose logs
          exit 1

      - name: Verify the frontend is served
        run: |
          curl -sf http://localhost:8080 | grep -qi "<!doctype html" \
            && echo "Frontend is serving HTML"

      - name: Tear down
        if: always()
        run: docker compose down -v