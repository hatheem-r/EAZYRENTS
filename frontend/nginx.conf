server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router does client-side routing, so any unknown path must still
    # return index.html and let the app resolve the route itself. Without this,
    # refreshing on a page like /vehicles/42 would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
